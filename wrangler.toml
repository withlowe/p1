name = "p1"
main = "worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "POSTS"
id = "835456da1ff84f3587b18db47fcee256"

[[d1_databases]]
binding = "DB"
database_name = "p1"
